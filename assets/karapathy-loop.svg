<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">karapathy-loop</title>
  <desc id="desc">A recursive loop symbol formed from two interlocking arcs around a central agent node, with the karapathy-loop wordmark.</desc>
  <defs>
    <linearGradient id="loopGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55E6C1"/>
      <stop offset="0.52" stop-color="#43B8D8"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5FFFF"/>
      <stop offset="1" stop-color="#A9F6E7"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(54 34)">
    <circle cx="146" cy="146" r="126" fill="#0B1220"/>
    <circle cx="146" cy="146" r="125" fill="none" stroke="#26364A" stroke-width="2"/>

    <!-- Two recursive arcs -->
    <path d="M 84 78 C 112 48, 164 43, 199 68 C 224 86, 237 117, 230 147"
          fill="none" stroke="url(#loopGradient)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 208 211 C 179 242, 128 249, 91 224 C 65 207, 52 176, 60 145"
          fill="none" stroke="url(#loopGradient)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 60 145 C 67 112, 85 91, 108 78"
          fill="none" stroke="url(#loopGradient)" stroke-width="15" stroke-linecap="round" opacity=".72"/>
    <path d="M 230 147 C 223 180, 205 201, 182 214"
          fill="none" stroke="url(#loopGradient)" stroke-width="15" stroke-linecap="round" opacity=".72"/>

    <!-- Arrowheads -->
    <path d="M 214 128 L 234 151 L 247 121" fill="none" stroke="#7DDBD0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 76 166 L 56 143 L 43 173" fill="none" stroke="#7DDBD0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central agent / feedback node -->
    <g filter="url(#softGlow)">
      <circle cx="145" cy="146" r="43" fill="#111E30" stroke="url(#loopGradient)" stroke-width="4"/>
      <circle cx="145" cy="146" r="23" fill="url(#nodeGradient)"/>
      <circle cx="145" cy="146" r="8" fill="#13263A"/>
    </g>

    <!-- Small connected nodes -->
    <g fill="#0B1220" stroke="#7DE7D1" stroke-width="4">
      <circle cx="91" cy="82" r="9"/>
      <circle cx="201" cy="210" r="9"/>
    </g>
    <g fill="#8B7CFF">
      <circle cx="91" cy="82" r="3.5"/>
      <circle cx="201" cy="210" r="3.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(360 0)">
    <text x="0" y="164" fill="#EAF2FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="82" font-weight="750" letter-spacing="-3">karapathy<tspan fill="#65DCC8">-loop</tspan></text>
    <rect x="4" y="194" width="470" height="3" rx="1.5" fill="url(#loopGradient)" opacity=".9"/>
    <text x="4" y="246" fill="#91A4BC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="600" letter-spacing="5.2">RECURSIVE AGENT EXPERIMENTS</text>
    <text x="4" y="292" fill="#60748E" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="450" letter-spacing="1.1">PROPOSE  ·  EVALUATE  ·  IMPROVE</text>
  </g>
</svg>
